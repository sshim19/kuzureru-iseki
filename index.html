<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">
    <title>崩れる遺跡の脱出</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c9b896'/%3E%3Crect x='4' y='19' width='24' height='7' rx='1.5' fill='%23ddc89a' stroke='%238a6a42' stroke-width='1.2'/%3E%3Crect x='6' y='19' width='20' height='2.2' fill='%23b7c984'/%3E%3Ccircle cx='16' cy='13.2' r='3.1' fill='%2324180f'/%3E%3Crect x='13.2' y='15.6' width='5.6' height='5.4' rx='1' fill='%23f4ead0'/%3E%3Crect x='13.2' y='18.2' width='5.6' height='1.2' fill='%23e09a7c'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./ui/styles.css">
  </head>
  <body>
    <div class="app" id="app">
      <header class="play-bar" id="play-bar" hidden>
        <button type="button" class="btn-quit" id="btn-quit">やめる</button>
      </header>

      <div class="stage" id="stage">
        <canvas id="game" width="360" height="640" aria-label="プレイ画面。左右を押してため、はなすと跳べます"></canvas>

        <div class="hud" id="play-hud" hidden>
          <p class="hud-height" id="hud-height">0m</p>
          <p class="hud-best" id="hud-best"></p>
        </div>

        <div class="hints" id="play-hints" hidden>
          <span class="hint hint-left">左</span>
          <span class="hint hint-right">右</span>
        </div>

        <section class="panel" id="screen-title">
          <h1 tabindex="-1">崩れる遺跡の脱出</h1>
          <p class="lead">足場が崩れる前に、上へ登ろう。</p>
          <div class="mode-toggle" role="radiogroup" aria-label="操作方法">
            <button type="button" class="mode-opt" data-mode="hold" aria-pressed="true">長押し</button>
            <button type="button" class="mode-opt" data-mode="swipe" aria-pressed="false">スワイプ</button>
          </div>
          <p class="rule" id="title-rule">左か右を押してためて、はなすとその向きに跳べます。長く押すほど、高く遠くまで跳べます。</p>
          <p class="meta" id="title-date">今日の遺跡</p>
          <p class="meta" id="title-record">記録はまだありません</p>
          <button type="button" class="action" id="btn-start">のぼる</button>
        </section>

        <section class="panel" id="screen-over" hidden>
          <h1 tabindex="-1">崩れた</h1>
          <p class="lead" id="over-height"></p>
          <p class="meta" id="over-today"></p>
          <p class="meta" id="over-best"></p>
          <p class="banner" id="over-new-best" hidden>最高記録です</p>
          <p class="banner" id="over-new-today" hidden>今日の最高です</p>
          <div class="mode-toggle" role="radiogroup" aria-label="操作方法">
            <button type="button" class="mode-opt" data-mode="hold" aria-pressed="true">長押し</button>
            <button type="button" class="mode-opt" data-mode="swipe" aria-pressed="false">スワイプ</button>
          </div>
          <p class="rule" id="over-rule">左か右を押してためて、はなすとその向きに跳べます。長く押すほど、高く遠くまで跳べます。</p>
          <div class="actions">
            <button type="button" class="action" id="btn-retry">もう一度</button>
            <div class="share-row" role="group" aria-label="共有先">
              <button type="button" class="share-btn" id="btn-share-x" aria-label="Xで共有">
                <svg viewBox="0 0 40 40" width="44" height="44" aria-hidden="true" focusable="false">
                  <rect width="40" height="40" rx="9" fill="#000"/>
                  <path fill="#fff" d="M21.62 17.86 30.11 8h-2.01l-7.37 8.52L14.84 8H8.5l8.9 12.68L8.5 32h2.01l7.79-9.01L25.16 32h6.34L21.62 17.86Zm-2.76 3.19-.9-1.26-7.17-10.02h3.08l5.79 8.09.9 1.26 7.54 10.52h-3.08l-6.16-8.59Z"/>
                </svg>
              </button>
              <button type="button" class="share-btn" id="btn-share-line" aria-label="LINEで共有">
                <svg viewBox="0 0 40 40" width="44" height="44" aria-hidden="true" focusable="false">
                  <rect width="40" height="40" rx="9" fill="#06C755"/>
                  <path fill="#fff" d="M20 8.8c-6.72 0-12.16 4.29-12.16 9.58 0 4.73 4.21 8.7 9.88 9.44.39.08.91.26 1.04.58.12.3.08.77.04 1.23l-.17 1.1c-.05.26.17.36.36.22 1.25-.74 3.38-2.03 3.66-2.21.31-.2.53-.24.83-.24 6.1-.86 10.4-4.8 10.4-9.12C33.88 13.09 28.54 8.8 20 8.8Z"/>
                  <path fill="#06C755" d="M12.55 16.05h1.62v6.15h3.05v1.4h-4.67zm6.05 0h1.62v7.55H18.6zm3.05 0h1.72l2.18 3.85V16.05h1.62v7.55h-1.72l-2.18-3.85v3.85H21.65zm7.05 0h4.2v1.4h-2.58v1.35h2.28v1.32h-2.28v2.08h2.7v1.4h-4.32z"/>
                </svg>
              </button>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="./play.mjs"></script>
  </body>
</html>
